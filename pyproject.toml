[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mini-research-browser"
version = "0.1.0"
description = "A small multi-agent research assistant for the terminal."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Gracy Pawani" }]
dependencies = [
  "ddgs>=9,<10",
  "rich>=13.7,<15",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
ai = ["google-genai>=1.0,<2"]
dev = ["pytest>=8,<9"]

[project.scripts]
research = "research.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["research"]
